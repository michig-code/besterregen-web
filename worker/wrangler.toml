name = "besterregen-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Geheimnisse werden NICHT hier eingetragen, sondern mit
#   npx wrangler secret put DISCORD_CLIENT_SECRET
#   npx wrangler secret put SUPABASE_SERVICE_KEY
# gesetzt.

# Route: alle Anfragen unter besterregen.de/api/* gehen an diesen Worker
routes = [
  { pattern = "besterregen.de/api/*", zone_name = "besterregen.de" },
  { pattern = "besterregen.de/l/*", zone_name = "besterregen.de" },
]

[vars]
SITE_URL = "https://besterregen.de"
API_URL = "https://besterregen.de/api"
DISCORD_CLIENT_ID = "1568347689069060217"            # öffentlich, darf hier stehen
GUILD_ID = "1448417260849987660"                     # ID von Besterregen
SUPABASE_URL = "https://zepjphmijrpugrxxuaqp.supabase.co"
VERIFY_LEVEL_ID = "151924233"
# Dauerhafte Einladung zum Discord-Server (nur der Code, z. B. "abc123xyz")
DISCORD_INVITE_CODE = "WDtXcSzy24"
# Discord-IDs der Admins (komma-getrennt), z. B. "123456789012345678"
GH_REPO = "michig-code/besterregen-web"
ADMIN_DISCORD_IDS = "693861086683725987"
