name: Liste synchronisieren

on:
  workflow_dispatch:
    inputs:
      list_id:
        description: "ID der Liste in der Datenbank"
        required: true
      source_url:
        description: "Adresse der Übersichtsseite"
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright installieren
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Liste auslesen und senden
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          LIST_ID: ${{ inputs.list_id }}
          INGEST_SECRET: ${{ secrets.SYNC_INGEST_SECRET }}
        run: python tools/sync_list.py
